name: Check

# Every check here comes from hk.pkl, so CI catches only what the pre-commit
# hook would have caught. Add new checks to hk.pkl, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    name: hk check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Check
        run: hk check --all
